name: Release

# Authorization comes from the `clojars` environment, not from this file.
# workflow_dispatch cannot be restricted by permission level, so anyone with
# write access can press Run workflow; the environment's required reviewers
# decide whether it proceeds, and its master-only deployment branch policy means
# a modified copy of this file on another ref cannot reach the secrets. Do not
# add an actor allowlist here -- a gate in a versioned file can be edited by
# anyone who can merge to master, and would read as protection while providing
# none.
on: workflow_dispatch

permissions:
  contents: write   # push the release tag
  actions: read     # verify-ci! reads build.yml run history
  id-token: write   # OIDC token the attestation is bound to
  attestations: write  # write the provenance and SBOM attestations

jobs:
  release:
    runs-on: ubuntu-latest
    environment: clojars
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0   # assert-untagged! and tag! need tag history

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: 'latest'

      - name: Build and publish
        # Use `clojure`, not `clj` -- `clj` wraps rlwrap, which GitHub runners
        # don't have installed, and fails with "Please install rlwrap for
        # command editing or use \"clojure\" instead."
        run: clojure -T:build deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}

      # Exact filenames, not globs. attest-sbom's sbom-path does not expand
      # globs at all, and subject-path's globs are the wrong tool here anyway:
      # `target/wire-*.jar` also matches wire-core-<v>.jar, so a globbed subject
      # would attest that one artifact's SBOM describes the other one too.
      - name: Locate the artifacts
        id: paths
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          {
            echo "core-jar=target/wire-core-$V.jar"
            echo "core-sbom=target/wire-core-$V-cyclonedx.json"
            echo "react-jar=target/wire-$V.jar"
            echo "react-sbom=target/wire-$V-cyclonedx.json"
          } >> "$GITHUB_OUTPUT"

      # One step covers both jars: provenance says which repo, workflow, and
      # commit built them, which is equally true of each.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/*.jar

      # One step per artifact: the two SBOMs describe different dependency sets
      # (wire-core is React-free, wire is the union), so each has to be bound to
      # the jar it actually describes.
      - name: Attest the wire-core SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ steps.paths.outputs.core-jar }}
          sbom-path: ${{ steps.paths.outputs.core-sbom }}

      - name: Attest the wire SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ steps.paths.outputs.react-jar }}
          sbom-path: ${{ steps.paths.outputs.react-sbom }}
